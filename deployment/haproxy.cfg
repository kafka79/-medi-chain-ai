global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 10s
    timeout client 120s
    timeout server 120s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      30s
    hold refused    30s
    hold nx         30s
    hold timeout    30s
    hold valid      10s
    hold obsolete   30s

frontend api_front
    bind *:80
    default_backend medi_api

backend medi_api
    balance leastconn
    # Active queueing: maxconn limits concurrent requests per server, queuing the rest
    server-template medi-api- 3 medi-api:8000 check maxconn 50 resolvers docker init-addr libc,none

frontend inference_front
    bind *:8001
    default_backend inference_api

backend inference_api
    balance leastconn
    # Active queueing: inference is heavy, queue safely. 
    # Weighted 95/5 for canary routing
    server-template inference-api- 2 inference-api:8001 check weight 95 maxconn 5 resolvers docker init-addr libc,none
    server inference-api-canary inference-api-canary:8001 check weight 5 maxconn 5 resolvers docker
