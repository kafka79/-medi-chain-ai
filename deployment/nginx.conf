events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream medi_api {
        least_conn;
        # medi-api runs with deploy.replicas: 3; resolve env to dedup all container IPs.
        server medi-api:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://medi_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_502 http_503 http_504;

            # Long timeout for inference-heavy endpoints
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;

            # Limit request body size (medical scans can be large)
            client_max_body_size 50M;
        }

        location /health {
            proxy_pass http://medi_api/health;
            proxy_read_timeout 5s;
        }
    }
}
