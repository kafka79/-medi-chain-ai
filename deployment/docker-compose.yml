
services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION_RENDERABLE=true
      - ETCD_AUTO_COMPACTION_RETENTION_RETENTION_DEFAULT=1
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - internal

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      # Flaw #1 Fix: Credentials sourced from .env file, not hardcoded
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/bin/data
    command: minio server /bin/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - internal

  redis:
    container_name: medi-chain-redis
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.16
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    depends_on:
      - "etcd"
      - "minio"
    networks:
      - internal

  medi-ui:
    container_name: medi-chain-ui
    image: saya2572/medi-chain-ui:v1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ..:/app
      - /app/data
    environment:
      - MILVUS_HOST=standalone
    stdin_open: true
    tty: true
    depends_on:
      - standalone
      - nginx
    networks:
      - internal

  inference-api:
    container_name: medi-chain-inference
    image: saya2572/medi-chain-inference:v1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["uvicorn", "deployment.api.inference_service:app", "--host", "0.0.0.0", "--port", "8001"]
    # Flaw #18 Partial Fix: inference-api no longer exposed to host — only reachable via internal network
    # Removed: ports: - "8001:8001"
    expose:
      - "8001"
    volumes:
      - ..:/app
      - shared-scans:/app/shared_scans
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in .env}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  medi-api:
    image: saya2572/medi-chain-api:v1.1
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    # Use gunicorn for process management in production
    command: ["gunicorn", "deployment.api.main:app", "-w", "1", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--timeout", "120"]
    # Flaw #3 Fix: No host port binding — traffic routed through Nginx load balancer
    expose:
      - "8000"
    volumes:
      - ..:/app
      - shared-scans:/app/shared_scans
    environment:
      - MILVUS_HOST=standalone
      - MAX_CONCURRENT_REQUESTS=1
      - API_KEY=${API_KEY:?API_KEY must be set in .env}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in .env}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      - INFERENCE_API_URL=http://inference-api:8001
      - RUN_BACKGROUND_WORKERS_IN_API=false
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      standalone:
        condition: service_healthy
      inference-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal

  # Flaw #3 Fix: Nginx reverse proxy for load balancing across medi-api replicas
  nginx:
    image: nginx:alpine
    container_name: medi-chain-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      medi-api:
        condition: service_healthy
    networks:
      - internal

  medi-worker:
    container_name: medi-chain-worker
    image: saya2572/medi-chain-worker:v1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["python", "-m", "src.worker"]
    volumes:
      - ..:/app
      - shared-scans:/app/shared_scans
    environment:
      - MILVUS_HOST=standalone
      - API_KEY=${API_KEY:?API_KEY must be set in .env}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in .env}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      - S3_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
      - INFERENCE_API_URL=http://inference-api:8001
      - RUN_BACKGROUND_WORKERS_IN_API=false
    depends_on:
      standalone:
        condition: service_healthy
      inference-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal

volumes:
  shared-scans:
    driver: local

networks:
  internal:
    name: medi-chain-internal
    driver: bridge
