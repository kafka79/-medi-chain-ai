
services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION_RENDERABLE=true
      - ETCD_AUTO_COMPACTION_RETENTION_RETENTION_DEFAULT=1
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/bin/data
    command: minio server /bin/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    container_name: medi-chain-redis
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.16
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    depends_on:
      - "etcd"
      - "minio"

  medi-ui:
    container_name: medi-chain-ui
    image: saya2572/medi-chain-ui:v1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ..:/app
      - /app/data
    environment:
      - MILVUS_HOST=standalone
    stdin_open: true
    tty: true
    depends_on:
      - standalone
      - medi-api

  inference-api:
    container_name: medi-chain-inference
    image: saya2572/medi-chain-inference:v1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["uvicorn", "deployment.api.inference_service:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - ..:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  medi-api:
    image: saya2572/medi-chain-api:v1.1
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    # Use gunicorn for process management in production
    command: ["gunicorn", "deployment.api.main:app", "-w", "1", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--timeout", "120"]
    ports:
      - "8000-8002:8000"
    volumes:
      - ..:/app
      - ./temp/storage:/app/temp/storage # Shared volume for local storage provider
    environment:
      - MILVUS_HOST=standalone
      - MAX_CONCURRENT_REQUESTS=1 # Per worker limit to protect VRAM
    deploy:
      replicas: 3 # Addresses 'Single-Node Bottleneck'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - standalone
      - inference-api
      - redis
      - minio

networks:
  default:
    name: milvus
